name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Test and compile Windows x64
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install FFmpeg for synthetic test media
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'FFmpeg installation failed.' }
          }

      - name: Generate test media
        run: ./Tests/New-Fixtures.ps1

      - name: Check MP4 and HLS sources
        run: dotnet run --project ./Tests/StreamBrowser.Checks.csproj --configuration Release -- ./Tests/fixtures

      - name: Compile self-contained Windows application
        run: dotnet publish ./StreamBrowser.csproj --configuration Release --runtime win-x64 --self-contained true --output ./release/httpbrowser-win-x64/data

      - name: Include instructions and dependency notices
        run: |
          Copy-Item -LiteralPath README.md -Destination ./release/httpbrowser-win-x64/data/README.md
          Copy-Item -LiteralPath TESTERGEBNISSE.md -Destination ./release/httpbrowser-win-x64/data/TESTERGEBNISSE.md
          Copy-Item -LiteralPath ThirdParty/LICENSE-WebView2.txt -Destination ./release/httpbrowser-win-x64/data/LICENSE-WebView2.txt
          Copy-Item -LiteralPath ThirdParty/NOTICE-WebView2.txt -Destination ./release/httpbrowser-win-x64/data/NOTICE-WebView2.txt
          if (-not (Test-Path -LiteralPath ./release/httpbrowser-win-x64/data/StreamBrowser.exe)) {
            throw 'Published executable is missing.'
          }

      - name: Build native start application
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual C++ build tools not found.' }
          Import-Module (Join-Path $vs 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          New-Item -ItemType Directory -Path ./release/launcher-build -Force | Out-Null
          cl.exe /nologo /std:c++17 /O2 /MT /DUNICODE /D_UNICODE /Fo:release/launcher-build/Launcher.obj /Fe:release/httpbrowser-win-x64/StreamBrowser.exe Launcher/Launcher.cpp /link /SUBSYSTEM:WINDOWS user32.lib
          if ($LASTEXITCODE -ne 0) { throw 'Native launcher build failed.' }

      - name: Check clean folder layout and launcher startup
        run: |
          $files = @(Get-ChildItem -LiteralPath ./release/httpbrowser-win-x64 -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'StreamBrowser.exe') { throw 'Only StreamBrowser.exe may be in the top-level folder.' }
          $app = Start-Process -FilePath ./release/httpbrowser-win-x64/StreamBrowser.exe -ArgumentList '--startup-check' -PassThru -WindowStyle Hidden
          if (-not $app.WaitForExit(60000)) { $app.Kill(); throw 'Launcher startup timed out.' }
          if ($app.ExitCode -ne 0) { throw "Launcher startup failed: $($app.ExitCode)" }

      - name: Upload Windows download
        uses: actions/upload-artifact@v7
        with:
          name: httpbrowser-windows-x64
          path: release/httpbrowser-win-x64/
          if-no-files-found: error
          retention-days: 30
