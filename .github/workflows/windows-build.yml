name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Test and compile Windows x64
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install FFmpeg for synthetic test media
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'FFmpeg installation failed.' }
          }

      - name: Generate test media
        run: ./Tests/New-Fixtures.ps1

      - name: Check MP4 and HLS sources
        run: dotnet run --project ./Tests/StreamBrowser.Checks.csproj --configuration Release -- ./Tests/fixtures

      - name: Compile self-contained Windows application
        run: dotnet publish ./StreamBrowser.csproj --configuration Release --runtime win-x64 --self-contained true --output ./release/httpbrowser-win-x64

      - name: Include instructions and dependency notices
        run: |
          Copy-Item -LiteralPath README.md -Destination ./release/httpbrowser-win-x64/README.md
          Copy-Item -LiteralPath TESTERGEBNISSE.md -Destination ./release/httpbrowser-win-x64/TESTERGEBNISSE.md
          Copy-Item -LiteralPath ThirdParty/LICENSE-WebView2.txt -Destination ./release/httpbrowser-win-x64/LICENSE-WebView2.txt
          Copy-Item -LiteralPath ThirdParty/NOTICE-WebView2.txt -Destination ./release/httpbrowser-win-x64/NOTICE-WebView2.txt
          if (-not (Test-Path -LiteralPath ./release/httpbrowser-win-x64/StreamBrowser.exe)) {
            throw 'Published executable is missing.'
          }

      - name: Upload Windows download
        uses: actions/upload-artifact@v7
        with:
          name: httpbrowser-windows-x64
          path: release/httpbrowser-win-x64/
          if-no-files-found: error
          retention-days: 30
